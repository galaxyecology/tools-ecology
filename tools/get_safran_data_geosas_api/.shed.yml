name: get_safran_data_geosas_api
owner: ecology
description: Extract climate data from SAFRAN geosas API
long_description: |
  Downloads daily SAFRAN climate reanalysis data (precipitation, temperature,
  reference evapotranspiration, and other variables) from the GEOSAS OGC-EDR
  API for one or more locations in metropolitan France, for use in ecological
  and agronomic modelling.
